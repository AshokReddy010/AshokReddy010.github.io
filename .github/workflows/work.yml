name: work pages
# Rebuild the project pages' case headers, case notes, galleries and full write-ups and the /work/ catalogue
# (tools/work.py) when projects.json or the generator changes, and every morning so each page's write-up follows
# its project's README and automation on GitHub. The tools inside each page are never touched.
on:
  push:
    branches: [main]
    paths: ["projects.json", "tools/work.py"]
  schedule:
    - cron: "37 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install markdown==3.10.3
      - run: python tools/work.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!*.pyc'
          if git diff --cached --quiet; then echo "nothing to rebuild"; exit 0; fi
          git commit -m "Rebuild project pages from projects.json"
          git push
